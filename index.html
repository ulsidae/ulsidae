<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ulsidae's blog</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background-color: #08080c;
      position: relative;
    }

    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.6;
      animation: floatBg 20s infinite alternate ease-in-out;
      pointer-events: none;
    }

    body::before {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(64, 84, 178, 0.4) 0%, rgba(15, 23, 42, 0) 70%);
      top: -10%;
      left: 15%;
    }

    body::after {
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(13, 148, 136, 0.25) 0%, rgba(15, 23, 42, 0) 70%);
      bottom: -15%;
      right: 10%;
      animation-delay: -10s;
    }

    @keyframes floatBg {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(80px, 50px) scale(1.15);
      }
      100% {
        transform: translate(-60px, -40px) scale(0.95);
      }
    }

    .login-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .user-avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 255, 255, 0.1);
    }

    .user-name {
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .btn-login {
      position: relative;
      width: 220px;
      padding: 12px 0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 2px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .btn-login:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    .btn-login:active {
      transform: translateY(0);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    .btn-login::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.25),
        transparent
      );
      transition: 0.5s;
    }

    .btn-login:hover::before {
      left: 100%;
    }

    .lang-selector {
      position: absolute;
      bottom: 40px;
      right: 40px;
      z-index: 10;
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 4px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .lang-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .lang-btn:hover:not(.active) {
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="https://avatars.githubusercontent.com/u/249910343?v=4" alt="User Profile" class="user-avatar">
    <div class="user-name" id="userName">WELCOME!</div>
    <button type="button" class="btn-login" id="signInBtn">VISIT PAGE</button>
  </div>

  <div class="lang-selector">
    <button type="button" class="lang-btn active" data-lang="en">EN</button>
    <button type="button" class="lang-btn" data-lang="fr">FR</button>
  </div>

  <script>
    let currentLang = 'en';

    const langBtns = document.querySelectorAll('.lang-btn');
    const userName = document.getElementById('userName');
    const signInBtn = document.getElementById('signInBtn');

    langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        langBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.getAttribute('data-lang');

        if (currentLang === 'en') {
          userName.textContent = 'WELCOME!';
          signInBtn.textContent = 'VISIT PAGE';
        } else if (currentLang === 'fr') {
          userName.textContent = 'BIENVENUE !';
          signInBtn.textContent = 'VISITER LA PAGE';
        }
      });
    });

    signInBtn.addEventListener('click', () => {
      if (currentLang === 'en') {
        window.location.href = 'https://ulsidae.github.io/ulsidae/docs/blog';
      } else if (currentLang === 'fr') {
        window.location.href = 'https://ulsidae.github.io/ulsidae/docs/blogue';
      }
    });
  </script>

</body>
</html>
